[project]
name = "ask-ai"
version = "0.1.0"
description = "A discussion forum API where mentioning an AI assistant, such as @claude or @gemini, gets you its answer"
readme = "README.md"
authors = [
    { name = "Naveed Massjouni", email = "naveed@vt.edu" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.10.0",
    "fastapi[standard]>=0.163.2",
    "google-genai>=3.5.0",
    "psycopg[binary,pool]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.50",
]

[project.scripts]
ask-ai = "ask_ai:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.fastapi]
entrypoint = "ask_ai.main:app"

[tool.alembic]
script_location = "%(here)s/migrations"

# Format new migration scripts like the rest of the code.
[[tool.alembic.post_write_hooks]]
name = "ruff"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"
