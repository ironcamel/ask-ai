[project]
name = "ask-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Naveed Massjouni", email = "naveed@vt.edu" }
]
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.10.0",
    "fastapi[standard]>=0.163.2",
    "google-genai>=3.5.0",
    "psycopg[binary,pool]>=3.3.9",
    "pwdlib[argon2]>=0.4.2",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "sqlmodel>=0.0.50",
]

[project.scripts]
ask-ai = "ask_ai:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.fastapi]
entrypoint = "ask_ai.main:app"
